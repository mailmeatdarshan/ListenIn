services:
  postgres:
    image: postgres:16-alpine
    container_name: listenin-postgres
    restart: unless-stopped
    ports:
      - '5444:5432'
    environment:
      POSTGRES_USER: listenin
      POSTGRES_PASSWORD: listenin
      POSTGRES_DB: listenin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U listenin']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: listenin-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
